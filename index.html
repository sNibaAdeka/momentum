<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Momentum — AI-диагностика инсульта по КТ и МРТ за секунды</title>
    <meta
      name="description"
      content="Momentum анализирует КТ и МРТ головного мозга, находит признаки инсульта, определяет тип, объём и локализацию очага и готовит отчёт для врача за 18 секунд. Интеграция с PACS и HIS, работа 24/7."
    />
    <meta name="theme-color" content="#f4f5f5" />
    <meta name="color-scheme" content="light" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Momentum — диагноз за секунды. Не за часы." />
    <meta
      property="og:description"
      content="AI-анализ КТ и МРТ при подозрении на инсульт: тип, объём и локализация очага и отчёт врачу, пока пациент ещё в аппарате."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315191c'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23e7edf2' stroke-width='2'/%3E%3Cpath d='M16 6a10 10 0 0 1 10 10' fill='none' stroke='%233d8bff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='19.2' cy='13.3' r='2.6' fill='%23ff5b4a'/%3E%3C/svg%3E"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Momentum",
        "applicationCategory": "MedicalApplication",
        "operatingSystem": "Web",
        "softwareVersion": "1.3 Beta",
        "inLanguage": "ru",
        "description": "AI-сервис анализа КТ и МРТ головного мозга: обнаружение признаков инсульта, тип и объём поражения, локализация очага и отчёт для врача.",
        "offers": [
          { "@type": "Offer", "name": "Core", "price": "199", "priceCurrency": "USD", "description": "в месяц" },
          { "@type": "Offer", "name": "Clinic+", "price": "399", "priceCurrency": "USD", "description": "в месяц" }
        ]
      }
    </script>
    <style>
      /* first paint before the bundle: no white flash */
      html, body { background: #f4f5f5; color: #15191c; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 640px; margin: 64px auto; padding: 0 16px; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>Momentum — диагноз за секунды. Не за часы.</h1>
        <p>
          Momentum анализирует КТ и МРТ, выделяет зону поражения и формирует понятный отчёт, пока пациент ещё находится в
          аппарате. Интеграция с PACS и HIS, результат за 18 секунд, работа 24/7.
        </p>
        <p>Тарифы: Core — $199 в месяц, Clinic+ — $399 в месяц.</p>
        <p>Для интерактивной версии сайта включите JavaScript.</p>
      </main>
    </noscript>
    <!-- Netlify Forms: static declaration so the demo-request form is detected at deploy time -->
    <form name="demo" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="email" /><input name="clinic" /><input name="role" /><input name="plan" /><input name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
